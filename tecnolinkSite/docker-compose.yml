services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Caddy parla con l'applicazione in chiaro sulla rete privata e le passa
      # X-Forwarded-Proto. Questa dice ad ASP.NET su quale porta rimandare, se mai
      # arrivasse una richiesta non cifrata: senza, la redirezione a HTTPS non sa
      # dove mandare e si limita a scrivere un avviso nei log a ogni richiesta.
      ASPNETCORE_HTTPS_PORT: "443"
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS}
      Smtp__FromName: ${SMTP_FROM_NAME}
      Smtp__ToAddress: ${SMTP_TO_ADDRESS}
      Analytics__GA4MeasurementId: ${GA4_MEASUREMENT_ID}
      Analytics__MetaPixelId: ${META_PIXEL_ID}
      Analytics__LinkedInPartnerId: ${LINKEDIN_PARTNER_ID}
      Analytics__LinkedInLeadConversionId: ${LINKEDIN_LEAD_CONVERSION_ID}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
